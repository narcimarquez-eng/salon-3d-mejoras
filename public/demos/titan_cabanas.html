<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titán contra las cabañas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
  /* Escena a pantalla completa con rótulos de película encima: un solo aspecto (atardecer), sin modo oscuro aparte */
  :root {
    --cielo: #d9b98f; --panel: rgba(18, 14, 10, 0.68); --texto: #f6ecdd; --oro: #f2b44a; --sangre: #c2452d;
    --titulo: "Cinzel", "Trajan Pro", Georgia, serif; --cuerpo: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cielo); font-family: var(--cuerpo); color: var(--texto); }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #hud { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
  #rotulo { background: var(--panel); padding: 8px 14px; border-radius: 6px; font-size: 15px; line-height: 1.35; max-width: 100%; }
  #rotulo:empty { display: none; }
  #rotulo b { color: var(--oro); font-weight: 600; }
  #botones { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  button { font: 600 14px var(--cuerpo); background: var(--panel); color: var(--texto); border: 1px solid rgba(246, 236, 221, 0.28); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--oro); outline: none; }
  #cartel { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  #cartel div { opacity: 0; transition: opacity 1.2s ease; }
  #cartel.ver div { opacity: 1; }
  #cartel h1 { margin: 0; font: 800 clamp(34px, 8vw, 92px)/1 var(--titulo); letter-spacing: 0.08em; color: var(--texto); text-shadow: 0 4px 30px rgba(0,0,0,0.65); text-wrap: balance; }
  #cartel p { margin: 12px 0 0; font: 600 clamp(14px, 2.4vw, 22px) var(--titulo); letter-spacing: 0.3em; text-transform: uppercase; color: var(--oro); text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
  #inicio { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(30,20,12,0.55), rgba(10,7,4,0.9)); z-index: 5; text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  #inicio h2 { margin: 0 0 6px; font: 800 clamp(28px, 6vw, 60px)/1.05 var(--titulo); letter-spacing: 0.06em; text-wrap: balance; }
  #inicio p { margin: 0 0 22px; color: rgba(246,236,221,0.75); }
  #empezar { font: 700 18px var(--titulo); letter-spacing: 0.12em; padding: 14px 28px; border-color: var(--oro); color: var(--oro); }
  #empezar[disabled] { opacity: 0.5; cursor: progress; }
  @media (prefers-reduced-motion: reduce) { #cartel div { transition: none; } }
</style>
</head>
<body>
<div id="inicio">
  <div>
    <h2>Titán contra las cabañas</h2>
    <p id="estadoCarga">Cargando el bosque, el titán y la aldea…</p>
    <button id="empezar" disabled>Empezar con sonido</button>
  </div>
</div>
<div id="cartel"><div><h1 id="cartelTitulo"></h1><p id="cartelSub"></p></div></div>
<div id="hud"><div id="rotulo"></div></div>
<div id="botones">
  <button id="sonido">Sonido: sí</button>
  <button id="pausa">Pausa</button>
  <button id="vel">Velocidad 1x</button>
  <button id="reiniciar">Reiniciar</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ================================================================ ajustes
const ALTO_TITAN = 1.5;          // las cabañas miden ~0,4: el titán les saca casi 4 veces
const SEPARACION = 3.4;          // distancia entre parcelas (cada parcela mide 2,6)
const VEL_ANDAR = 0.95;          // casa con el paso de la animación Walk a esta escala
const GRAVEDAD = 4.0;            // baja: los trozos caen "a cámara lenta", como de gigante
const DURA_INTRO = 6.5;
const CABANAS = [
  { f: 'cabana_1_troncos_clasica', nombre: 'Cabaña de troncos', golpe: 'golpe' },
  { f: 'cabana_2_posada_dos_plantas', nombre: 'Posada de dos plantas', golpe: 'salto' },
  { f: 'cabana_3_pescador_pilotes', nombre: 'Cabaña del pescador', golpe: 'golpe' },
  { f: 'cabana_4_torre_de_vigia', nombre: 'Torre de vigía', golpe: 'salto' },
  { f: 'cabana_5_redonda', nombre: 'Cabaña redonda', golpe: 'salto+golpe' },
];
// instante del impacto en cada clip (medido en el .glb): puño abajo / pies en el suelo
const CLIP = { golpe: { nombre: 'Attack', impacto: 0.45 }, salto: { nombre: 'JumpBite', impacto: 1.1 } };
const SUELO_FIJO = /^(Hierba|Camino|Suelo|SueloPB|Agua)(_\d+)?$/;
// ruta de los modelos: en el repositorio, .glb (el titán con Draco); publicada, texto base64
const EMPAQUETADO = false;
const RUTA_DRACO = '../draco/';

const captura = new URLSearchParams(location.search).has('captura');
const azar = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; })();
const entre = (a, b) => a + (b - a) * azar();

// ================================================================ escena
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: captura });
renderer.setPixelRatio(Math.min(captura ? 1 : 1.75, window.devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BRUMA = 0xcdb49a;
scene.fog = new THREE.Fog(BRUMA, 10, 46);
scene.background = new THREE.Color(BRUMA);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.02, 120);
scene.add(new THREE.HemisphereLight(0xc8d8ff, 0x4b5a2a, 1.25));
const sol = new THREE.DirectionalLight(0xffd29a, 3.2);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 30 });
sol.shadow.bias = -0.0004;
sol.shadow.normalBias = 0.02;
scene.add(sol, sol.target);
const SOL_DIR = new THREE.Vector3(5, 4, -3.2).normalize();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- cielo de atardecer
{
  const geo = new THREE.SphereGeometry(90, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { arriba: { value: new THREE.Color(0x3d6aa8) }, horizonte: { value: new THREE.Color(0xf0c58e) }, solDir: { value: SOL_DIR } },
    vertexShader: 'varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 arriba; uniform vec3 horizonte; uniform vec3 solDir; varying vec3 vp;
      void main(){ float h = clamp(vp.y, 0.0, 1.0); vec3 c = mix(horizonte, arriba, pow(h, 0.55));
        float s = max(dot(vp, solDir), 0.0); c += vec3(1.0, 0.75, 0.45) * (pow(s, 40.0) * 1.2 + pow(s, 6.0) * 0.25);
        if (vp.y < 0.0) c = horizonte; gl_FragColor = vec4(c, 1.0); }`,
  });
  scene.add(new THREE.Mesh(geo, mat));
}

// ---------------------------------------------------------------- texturas pintadas con código
function lienzo(w, h, pintar) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  pintar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const manchas = (g, w, h, n, colores, r0, r1, alfa = 0.5) => {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = alfa * entre(0.4, 1);
    g.fillStyle = colores[Math.floor(azar() * colores.length)];
    const x = azar() * w, y = azar() * h, r = entre(r0, r1);
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill(); }
  }
  g.globalAlpha = 1;
};
const TEX = {
  hierba: lienzo(512, 512, (g, w, h) => {
    g.fillStyle = '#56782f'; g.fillRect(0, 0, w, h);
    manchas(g, w, h, 900, ['#4a6b28', '#63883a', '#6f8f3c', '#3f5d22', '#7a8a42'], 4, 26, 0.35);
    g.lineWidth = 1.2;
    for (let i = 0; i < 5000; i++) { g.strokeStyle = azar() < 0.5 ? 'rgba(130,160,70,0.5)' : 'rgba(40,62,22,0.5)'; const x = azar() * w, y = azar() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + entre(-2, 2), y - entre(3, 7)); g.stroke(); }
  }),
  tierra: lienzo(256, 256, (g, w, h) => {
    g.fillStyle = '#8b6a44'; g.fillRect(0, 0, w, h);
    manchas(g, w, h, 500, ['#7a5a38', '#9b7a52', '#6a4c2f', '#a58660'], 2, 12, 0.4);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(${entre(150, 200)|0},${entre(140, 180)|0},${entre(120, 150)|0},0.8)`; g.fillRect(azar() * w, azar() * h, 2, 2); }
  }),
  corteza: lienzo(128, 256, (g, w, h) => {
    g.fillStyle = '#5a4130'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 3) { g.fillStyle = `rgba(${entre(30, 110)|0},${entre(22, 80)|0},${entre(14, 55)|0},0.7)`; g.fillRect(x + entre(-1, 1), 0, entre(1, 3), h); }
    for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(20,14,8,0.5)'; g.fillRect(azar() * w, azar() * h, entre(4, 10), 2); }
  }),
  hojas: lienzo(256, 256, (g, w, h) => {
    g.fillStyle = '#2f5a24'; g.fillRect(0, 0, w, h);
    manchas(g, w, h, 1400, ['#3e7330', '#24461b', '#4f8a38', '#1c3815', '#5f9640'], 2, 7, 0.75);
  }),
  pino: lienzo(256, 256, (g, w, h) => {
    g.fillStyle = '#20402a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { g.strokeStyle = ['#2d5a38', '#183222', '#3b6e45', '#122718'][i % 4]; g.lineWidth = 1.5; const x = azar() * w, y = azar() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + entre(-4, 4), y + entre(4, 9)); g.stroke(); }
  }),
  madera: lienzo(256, 128, (g, w, h) => {
    g.fillStyle = '#c9c0b4'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 2) { g.fillStyle = `rgba(${entre(70, 140)|0},${entre(55, 110)|0},${entre(40, 80)|0},${entre(0.15, 0.4)})`; g.fillRect(0, y, w, entre(1, 2)); }
    for (let i = 0; i < 18; i++) { g.strokeStyle = 'rgba(60,40,25,0.5)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(azar() * w, azar() * h, entre(4, 9), entre(2, 4), 0, 0, Math.PI * 2); g.stroke(); }
  }),
  tejas: lienzo(256, 256, (g, w, h) => {
    g.fillStyle = '#d0c6ba'; g.fillRect(0, 0, w, h);
    const f = 16;
    for (let y = 0; y < h; y += f) for (let x = -((y / f) % 2) * 16; x < w; x += 32) {
      g.fillStyle = `rgba(${entre(150, 210)|0},${entre(130, 180)|0},${entre(110, 160)|0},1)`; g.fillRect(x + 1, y + 1, 30, f - 2);
      g.fillStyle = 'rgba(40,25,15,0.45)'; g.fillRect(x, y + f - 3, 32, 3);
    }
  }),
  piedra: lienzo(256, 256, (g, w, h) => {
    g.fillStyle = '#b8b2a8'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 28) for (let x = -(y % 56 ? 22 : 0); x < w; x += 44) {
      g.fillStyle = `rgb(${entre(150, 205)|0},${entre(145, 198)|0},${entre(135, 188)|0})`;
      g.beginPath(); g.roundRect(x + 2, y + 2, 40, 24, 6); g.fill();
    }
    manchas(g, w, h, 300, ['#8d877c', '#d9d3c9'], 1, 4, 0.3);
  }),
  roca: lienzo(128, 128, (g, w, h) => {
    g.fillStyle = '#7d7a72'; g.fillRect(0, 0, w, h);
    manchas(g, w, h, 400, ['#6a675f', '#959189', '#5b6a48', '#8a877e'], 2, 9, 0.5);
  }),
};
TEX.hierba.repeat.set(70, 70);

// ================================================================ carga
const draco = new DRACOLoader();
draco.setDecoderPath(RUTA_DRACO);
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
async function cargarGlb(nombre) {
  if (!EMPAQUETADO) return loader.loadAsync(`./${nombre}.glb`);
  // publicada: el .glb va como texto base64 y se decodifica aquí
  const r = await fetch(`./${nombre}.txt`);
  if (!r.ok) throw new Error(`No se pudo cargar ${nombre}`);
  const bin = atob((await r.text()).trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return loader.parseAsync(bytes.buffer, '');
}
const rotulo = document.getElementById('rotulo');
const decir = (html) => { rotulo.innerHTML = html; };
const cartel = document.getElementById('cartel');
function mostrarCartel(t, s, dura) {
  document.getElementById('cartelTitulo').textContent = t;
  document.getElementById('cartelSub').textContent = s;
  cartel.classList.add('ver');
  tCartel = dura;
}
let tCartel = 0;

let titanGltf, cabGltf;
try {
  [titanGltf, ...cabGltf] = await Promise.all([cargarGlb('titan'), ...CABANAS.map((c) => cargarGlb(`cabanas/${c.f}`))]);
} catch (e) {
  document.getElementById('estadoCarga').textContent = 'No se pudieron cargar los modelos. Recarga la página para intentarlo otra vez.';
  throw e;
}

// ================================================================ bosque
const LARGO = SEPARACION * (CABANAS.length - 1);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ map: TEX.hierba, roughness: 1 }));
suelo.rotation.x = -Math.PI / 2;
suelo.position.set(0, -0.006, LARGO / 2);
suelo.receiveShadow = true;
scene.add(suelo);
{
  // camino de tierra por donde avanza el titán, con los bordes deshilachados
  const alfa = lienzo(64, 64, (g, w, h) => { const r = g.createLinearGradient(0, 0, w, 0); r.addColorStop(0, 'rgba(255,255,255,0)'); r.addColorStop(0.3, '#fff'); r.addColorStop(0.7, '#fff'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
  alfa.colorSpace = THREE.NoColorSpace;
  const t = TEX.tierra.clone(); t.repeat.set(2, 30); t.needsUpdate = true;
  const camino = new THREE.Mesh(new THREE.PlaneGeometry(1.4, LARGO + 14), new THREE.MeshStandardMaterial({ map: t, alphaMap: alfa, transparent: true, roughness: 1, depthWrite: false }));
  camino.rotation.x = -Math.PI / 2;
  camino.position.set(0, 0.002, LARGO / 2 - 2);
  camino.receiveShadow = true;
  scene.add(camino);
}
const libre = (x, z) => Math.abs(x) < 1.9 && z > -7 && z < LARGO + 2.5;   // pasillo del titán y parcelas
function instanciar(geo, mat, n, poner) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++) { poner(o, i); o.updateMatrix(); m.setMatrixAt(i, o.matrix); }
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
{
  const sitios = [];
  while (sitios.length < 520) {
    const x = entre(-16, 16), z = entre(-12, LARGO + 14);
    if (libre(x, z)) continue;
    if (Math.abs(x) < 2.3 && azar() < 0.6) continue;           // claro a los lados del camino
    if (x > 1.5 && x < 5.4 && z > -8 && z < LARGO + 5) continue; // prado del lado de la cámara: nada le tapa la vista
    sitios.push({ x, z, s: entre(0.6, 1.5) * (Math.abs(x) > 6 ? 1.25 : 1), r: azar() * Math.PI * 2, pino: azar() < 0.55 });
  }
  const pinos = sitios.filter((p) => p.pino), frondosos = sitios.filter((p) => !p.pino);
  const matCorteza = new THREE.MeshStandardMaterial({ map: TEX.corteza, roughness: 1 });
  const matPino = new THREE.MeshStandardMaterial({ map: TEX.pino, roughness: 0.95, flatShading: true });
  const matHojas = new THREE.MeshStandardMaterial({ map: TEX.hojas, roughness: 0.9, flatShading: true });
  const tronco = new THREE.CylinderGeometry(0.035, 0.06, 0.5, 6).translate(0, 0.25, 0);
  instanciar(tronco, matCorteza, sitios.length, (o, i) => { const p = sitios[i]; o.position.set(p.x, 0, p.z); o.rotation.set(0, p.r, 0); o.scale.set(p.s, p.s * (p.pino ? 0.9 : 1.1), p.s); });
  for (const [r, alto, y] of [[0.42, 0.75, 0.35], [0.33, 0.62, 0.68], [0.22, 0.5, 0.98]]) {
    const cono = new THREE.ConeGeometry(r, alto, 7).translate(0, y + alto / 2, 0);
    instanciar(cono, matPino, pinos.length, (o, i) => { const p = pinos[i]; o.position.set(p.x, 0, p.z); o.rotation.set(0, p.r, 0); o.scale.setScalar(p.s); });
  }
  const copa = new THREE.IcosahedronGeometry(0.42, 1);
  const pos = copa.attributes.position;
  for (let i = 0; i < pos.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(pos, i); v.multiplyScalar(entre(0.82, 1.15)); v.y *= 0.85; pos.setXYZ(i, v.x, v.y, v.z); }
  copa.computeVertexNormals(); copa.translate(0, 0.78, 0);
  instanciar(copa, matHojas, frondosos.length, (o, i) => { const p = frondosos[i]; o.position.set(p.x, 0, p.z); o.rotation.set(0, p.r, 0); o.scale.set(p.s * 1.05, p.s, p.s * 1.05); });
  // rocas y matas de hierba
  const roca = new THREE.DodecahedronGeometry(0.12, 0);
  instanciar(roca, new THREE.MeshStandardMaterial({ map: TEX.roca, roughness: 1, flatShading: true }), 90, (o) => {
    let x, z; do { x = entre(-14, 14); z = entre(-10, LARGO + 12); } while (libre(x, z) && Math.abs(x) < 0.8);
    o.position.set(x, 0.02, z); o.rotation.set(azar() * 3, azar() * 3, azar() * 3); const s = entre(0.4, 2.2); o.scale.set(s, s * 0.6, s);
  });
  const mata = new THREE.ConeGeometry(0.02, 0.07, 3).translate(0, 0.035, 0);
  const matas = instanciar(mata, new THREE.MeshStandardMaterial({ roughness: 1 }), 2600, (o) => {
    let x, z; do { x = entre(-12, 12); z = entre(-8, LARGO + 10); } while (Math.abs(x) < 0.55);
    o.position.set(x, 0, z); o.rotation.set(entre(-0.2, 0.2), azar() * 3, entre(-0.2, 0.2)); o.scale.setScalar(entre(0.7, 1.8));
  });
  matas.castShadow = false;
  const col = new THREE.Color();
  for (let i = 0; i < 2600; i++) matas.setColorAt(i, col.setHSL(entre(0.2, 0.3), entre(0.4, 0.6), entre(0.22, 0.36)));
  // montañas lejanas
  const monte = new THREE.ConeGeometry(1, 1, 6).translate(0, 0.5, 0);
  const montes = instanciar(monte, new THREE.MeshStandardMaterial({ color: 0x5b6878, roughness: 1, flatShading: true }), 34, (o, i) => {
    const a = (i / 34) * Math.PI * 2 + entre(-0.05, 0.05), r = entre(40, 52);
    o.position.set(Math.cos(a) * r, -0.5, LARGO / 2 + Math.sin(a) * r); o.scale.set(entre(7, 13), entre(6, 15), entre(7, 13)); o.rotation.y = azar() * 3;
  });
  montes.castShadow = false;
}

// ================================================================ titán
const titan = titanGltf.scene;
const caja = new THREE.Box3().setFromObject(titan);
const escala = ALTO_TITAN / (caja.max.y - caja.min.y);
const raiz = new THREE.Group();
titan.scale.setScalar(escala);
titan.position.y = -caja.min.y * escala;
raiz.add(titan);
scene.add(raiz);
titan.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
const huesos = {};

function texturizar(o) {
  const m = o.material;
  if (!m || !m.color || /Cristal|Fuego|Agua/.test(o.name)) return;
  let tex = null;
  if (/Techo|Tejado|Cumbrera|TorreTecho/.test(o.name)) tex = TEX.tejas;
  else if (/Piedra|Chimenea|Almena|TorreMuro|Hogar|Escalon/.test(o.name)) tex = TEX.piedra;
  else if (/Arbol\d+_Copa/.test(o.name)) tex = TEX.hojas;
  else if (/Arbol\d+_Tronco/.test(o.name)) tex = TEX.corteza;
  else if (/^Camino/.test(o.name)) tex = TEX.tierra;
  else if (!/Colchon|Manta|Almohada/.test(o.name)) tex = TEX.madera;
  if (!tex) return;
  const clave = m.uuid + tex.uuid;
  if (!materialesHechos.has(clave)) {
    const n = m.clone(); n.map = tex;
    if (tex === TEX.hojas || tex === TEX.corteza) n.color.multiplyScalar(1.6);
    n.roughness = 0.9; n.metalness = 0;

function tumbarArbol(ar, desde) {
  if (ar.caido) return;
  ar.caido = true;
  const pivote = new THREE.Group();
  const b = new THREE.Box3().setFromObject(ar.ms[0]);
  pivote.position.set(ar.base.x, b.min.y, ar.base.z);
  scene.add(pivote);
  pivote.updateMatrixWorld(true);
  for (const m of ar.ms) pivote.attach(m);
  const dir = new THREE.Vector3(ar.base.x - desde.x, 0, ar.base.z - desde.z);
  if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
  dir.normalize();

function romper(p, impacto, fuerza) {
  if (p.rota) return;
  p.rota = true;
  for (const m of p.trozos) {
    scene.attach(m);
    const bb = new THREE.Box3().setFromObject(m);
    const c = bb.getCenter(new THREE.Vector3());
    const dir = new THREE.Vector3().subVectors(c, impacto); dir.y = 0;
    const d = dir.length();
    if (d < 1e-4) dir.set(azar() - 0.5, 0, azar() - 0.5);

  for (const ar of p.arboles) if (ar.base.distanceTo(impacto) < 1.0) tumbarArbol(ar, impacto);
  lanzarAldeanos(impacto, 0.55);
  soltarPolvo(impacto, 40, 1.4);
  temblor = 0.5;

  if (estado === 'fin') { if (!captura && tEstado > 9) empezar(); return; }
  const c = CABANAS[idx], p = parcelas[idx];
  const tipos = c.golpe.split('+');
  if (!p.asustada && raiz.position.z > p.casa.min.z - 2.3) { p.asustada = true; asustar(idx); }
  if (estado === 'andar') {
    poner('andar');
    const meta = parada(p, tipos[0]);
    raiz.position.z = Math.min(meta, raiz.position.z + VEL_ANDAR * dt);
    raiz.position.x += (p.centro.x - raiz.position.x) * Math.min(1, dt * 2);
    for (const q of parcelas) for (const ar of q.arboles) {
      if (!ar.caido && Math.hypot(ar.base.x - raiz.position.x, ar.base.z - raiz.position.z) < 0.33) tumbarArbol(ar, raiz.position);
    }
    if (raiz.position.z >= meta - 1e-4) { estado = 'accion'; pasos = tipos.slice(); siguienteGolpe(); }
  } else if (estado === 'accion') {
    const k = pasos[0], a = A[k];
    if (!impactado && a.time >= CLIP[k].impacto) {
      impactado = true;
      const punto = k === 'golpe' ? mundo('RightHand') : mundo('RightFoot').add(mundo('LeftFoot')).multiplyScalar(0.5);
      punto.y = 0.05;
      punto.x = THREE.MathUtils.clamp(punto.x, p.casa.min.x, p.casa.max.x);
      punto.z = THREE.MathUtils.clamp(punto.z, p.casa.min.z, p.casa.max.z);
      if (!p.rota) romper(p, punto, k === 'salto' ? 1.5 : 1.2);
      else { soltarPolvo(punto, 18); temblor = 0.35; empujarEscombros(punto); lanzarAldeanos(punto, 0.5); sonar('destruccion', 0.6); }
      pajaros = false;
      decir(`<b>Cabaña ${idx + 1}/5</b> · ${c.nombre} · <b>${k === 'golpe' ? '¡Golpe!' : '¡Salto!'}</b>`);
    }
    if (a.time >= a.getClip().duration - 1e-3 || (!a.isRunning() && tEstado > 0.3)) {
      pasos.shift();
      if (pasos.length) siguienteGolpe();
      else { estado = 'pausa'; tEstado = 0; poner('quieto', 0.3); }
    }
  } else if (estado === 'pausa') {
    if (tEstado > 1.1) {
      idx++;
      if (idx >= CABANAS.length) {
        estado = 'fin'; tEstado = 0; decir('');
        mostrarCartel('LA ALDEA HA CAÍDO', 'cinco cabañas, ni una en pie', 6);
        sonar('rugido'); temblor = 0.5;
        return;
      }
      estado = 'andar'; tEstado = 0;
      decir(`<b>Cabaña ${idx + 1}/5</b> · ${CABANAS[idx].nombre}`);
    }
  }
}
function siguienteGolpe() { impactado = false; tEstado = 0; poner(pasos[0], 0.2); }
function empujarEscombros(punto) {
  for (const t of trozosVivos) {
    const d = t.m.position.distanceTo(punto);
    if (d > 0.9) continue;
    const dir = new THREE.Vector3().subVectors(t.m.position, punto); dir.y = 0; dir.normalize();
    t.v.addScaledVector(dir, 0.5 / (0.4 + d)); t.v.y += entre(0.5, 1.1); t.quieto = false;
  }
}
// pisadas: el pie baja hasta el suelo
function pasoPisadas() {
  if (estado !== 'andar') { for (const k in pies) pies[k].abajo = true; return; }
  for (const k in pies) {
    const y = mundo(k).y, abajo = y < pieReposo + 0.02;
    if (abajo && !pies[k].abajo) {
      sonar('pisada', 1); temblor = Math.max(temblor, 0.12);
      soltarPolvo(mundo(k).setY(0.02), 4, 0.5);
    }
    pies[k].abajo = abajo;
  }
}

// ================================================================ física
const q = new THREE.Quaternion(), e = new THREE.Euler();
function pasoFisica(dt) {
  for (const t of trozosVivos) {
    if (t.quieto) continue;
    t.v.y -= GRAVEDAD * dt;
    t.m.position.addScaledVector(t.v, dt);
    q.setFromEuler(e.set(t.w.x * dt, t.w.y * dt, t.w.z * dt));
    t.m.quaternion.premultiply(q);
    const fondo = -t.minY * 0.5 + 0.01;
    if (t.m.position.y < fondo) {
      t.m.position.y = fondo;
      if (Math.abs(t.v.y) > 0.4) t.v.y *= -0.3; else t.v.y = 0;
      t.v.x *= 0.6; t.v.z *= 0.6; t.w.multiplyScalar(0.55);
      if (t.v.lengthSq() < 0.004) t.quieto = true;
    }
  }
  for (const a of arbolesCayendo) {
    if (a.ang >= Math.PI / 2 - 0.05) continue;
    a.vel += 3.5 * Math.sin(a.ang + 0.15) * dt;
    a.ang = Math.min(Math.PI / 2 - 0.05, a.ang + a.vel * dt);
    a.pivote.quaternion.setFromAxisAngle(a.eje, a.ang);
  }
  for (let i = polvo.length - 1; i >= 0; i--) {
    const d = polvo[i];
    d.vida += dt;
    d.s.position.addScaledVector(d.v, dt);
    d.v.multiplyScalar(1 - dt * 1.5);
    d.s.scale.setScalar((0.2 + d.vida * 0.6) * d.tam);
    d.s.material.opacity = Math.max(0, 1 - d.vida / d.dura) * 0.85;
    if (d.vida > d.dura) { scene.remove(d.s); polvo.splice(i, 1); }
  }
  if (pajaros) { tPajaro -= dt; if (tPajaro <= 0) { sonar('pajaro'); tPajaro = entre(1.5, 4); } }
}

// ================================================================ cámara
const mira = new THREE.Vector3();
const suave = (x) => x * x * (3 - 2 * x);
function pasoCamara(dt) {
  const r = raiz.position;
  const sigue = new THREE.Vector3(r.x + 3.3, 1.9, r.z - 0.2);
  const miraSigue = new THREE.Vector3(r.x, 0.5, r.z + 1.0);
  if (estado === 'intro') {
    // primer plano de la cara; a los 2 s empieza a alejarse hasta la vista de seguimiento
    const cara = mundo('Head').add(new THREE.Vector3(0, 0.05, 0));
    const cerca = cara.clone().add(new THREE.Vector3(0.05, 0.02, 0.42));
    const medio = cara.clone().add(new THREE.Vector3(1.3, -0.2, 1.8));
    const t = THREE.MathUtils.clamp((tEstado - 2.0) / (DURA_INTRO - 2.0), 0, 1);
    const u = suave(t);
    // curva: cara -> de frente y abierto -> seguimiento lateral
    const a = cerca.clone().lerp(medio, u), b = medio.clone().lerp(sigue, u);
    camara.copy(a.lerp(b, u));
    mira.copy(cara).lerp(miraSigue, suave(Math.max(0, t * 1.2 - 0.2)));
  } else if (estado === 'fin') {
    const ang = tEstado * 0.18;
    const c = new THREE.Vector3(r.x + Math.cos(ang) * 3.6, 1.6 + tEstado * 0.05, r.z + Math.sin(ang) * 3.6);
    camara.lerp(c, Math.min(1, dt * 0.8));
    mira.lerp(new THREE.Vector3(r.x, 0.7, r.z), Math.min(1, dt * 2));
  } else {
    camara.lerp(sigue, Math.min(1, dt * 1.6));
    mira.lerp(miraSigue, Math.min(1, dt * 3));
  }
  camera.position.copy(camara);
  if (temblor > 0) {
    camera.position.x += (Math.random() - 0.5) * temblor * 0.1;
    camera.position.y += (Math.random() - 0.5) * temblor * 0.1;
    temblor = Math.max(0, temblor - dt);
  }
  camera.lookAt(mira);
  sol.position.copy(r).addScaledVector(SOL_DIR, 12);
  sol.target.position.set(r.x, 0, r.z + 0.8);
}

// ================================================================ bucle
let velocidad = 1, pausado = false;
function avanzar(dt) {
  const n = Math.max(1, Math.ceil(dt / (1 / 60)));
  for (let i = 0; i < n; i++) {
    const h = dt / n;
    reloj += h;
    mixer.update(h);
    titan.updateMatrixWorld(true);
    pasoGuion(h);
    pasoPisadas();
    pasoAldeanos(h);
    pasoFisica(h);
  }
  if (tCartel > 0) { tCartel -= dt; if (tCartel <= 0) cartel.classList.remove('ver'); }
  pasoCamara(dt);
  renderer.render(scene, camera);
}
document.getElementById('pausa').onclick = (ev) => { pausado = !pausado; ev.target.textContent = pausado ? 'Seguir' : 'Pausa'; };
document.getElementById('vel').onclick = (ev) => { velocidad = velocidad === 1 ? 0.5 : velocidad === 0.5 ? 2 : 1; ev.target.textContent = `Velocidad ${velocidad}x`; };
document.getElementById('reiniciar').onclick = () => empezar();
document.getElementById('sonido').onclick = (ev) => { Sonido.iniciar(); ev.target.textContent = Sonido.alternar() ? 'Sonido: sí' : 'Sonido: no'; };

empezar();
// primer fotograma ya dibujado detrás de la portada
mixer.update(0); titan.updateMatrixWorld(true); pasoCamara(0); renderer.render(scene, camera);
const inicio = document.getElementById('inicio');
if (captura) {
  inicio.remove();
  document.getElementById('botones').hidden = true;
  window.__paso = (dt) => avanzar(dt);
  window.__estado = () => ({ estado, idx });
  window.__sucesos = () => sucesos;
  window.__listo = true;
} else {
  document.getElementById('estadoCarga').textContent = 'Pulsa para empezar. Mejor con auriculares.';
  const boton = document.getElementById('empezar');
  boton.disabled = false;
  boton.focus();
  boton.onclick = () => {
    Sonido.iniciar();
    inicio.remove();
    empezar();
    const r = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(0.05, r.getDelta());
      if (pausado) { renderer.render(scene, camera); return; }
      avanzar(dt * velocidad);
    });
  };
}
</script>
</body>
